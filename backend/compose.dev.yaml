name: easygenerator-dev

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/easygenerator
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-32chars}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
    command: ["npm", "run", "start:dev", "--", "-p", "tsconfig.docker.json"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      API_URL: http://api:3000
      SESSION_SECRET: ${SESSION_SECRET:-easygenerator-dev-session-secret}
      CHOKIDAR_USEPOLLING: "true"
    command:
      [
        "sh",
        "-c",
        "if [ ! -x node_modules/.bin/react-router ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api-node-modules:
  frontend-node-modules:
  mongo-data:
  redis-data:
